services:
  meccha:
    build:
      context: .
    image: superchameleon:app
    # Load-bearing: skips Portainer's pre-`up` pull of an image that lives in no
    # registry, and rebuilds on every `up`. See docs/DEPLOYMENT.md.
    pull_policy: build
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SESSION_NAME: "Meccha Chameleon"
      PUBLIC_GAME_PORT: "${PUBLIC_GAME_PORT:-3000}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
