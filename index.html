<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <!-- `maximum-scale=1, user-scalable=no`: a pinch-zoom on a game canvas is
         never what anybody meant, and it breaks the pointer maths. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Super Chameleon</title>
    <meta name="description" content="A multiplayer hide-and-seek game." />
    <!-- CrazyGames SDK v3 for instant multiplayer, ad lifecycle, and room invites -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  </head>
  <body class="min-h-full overflow-hidden bg-neutral-950">
    <div id="root" class="contents"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
